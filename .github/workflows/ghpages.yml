name: Deploy GhPages

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    if: github.repository == 'sake92/codeps'
    # flatmark renders code highlighting via Selenium + pinned Chrome (v138);
    # this only works reliably on macOS runners (same as deder + flatmark use)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Flatmark
        run: |
          FLATMARK_VERSION=0.0.29
          curl -L https://github.com/sake92/flatmark/releases/download/v${FLATMARK_VERSION}/flatmark-1.0.0.pkg -o flatmark.pkg
          sudo installer -verbose -pkg flatmark.pkg -target /
      - name: Build
        env:
          FLATMARK_BASE_URL: https://sake92.github.io/codeps
        run: ./scripts/build-docs.sh
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/_site
