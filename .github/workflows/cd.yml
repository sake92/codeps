name: CD

on:
  push:
    branches: [main]
    tags: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-cli:
    if: github.repository == 'sake92/codeps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: coursier/cache-action@v7
      - name: Set Homebrew env
        shell: bash
        run: echo "HOMEBREW_NO_SANDBOX_LINUX=1" >> $GITHUB_ENV
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install deder
        run: brew install sake92/tap/deder
      - name: Build CLI assembly
        shell: bash -eo pipefail {0}
        run: deder exec -t assembly -m cli
      - name: Name the jar
        shell: bash -eo pipefail {0}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=$(deder exec -t version -m cli -f json | jq -r '.results.cli')
            JAR="codeps-cli-${VERSION}.jar"
          else
            # fixed name so the rolling "main" release asset gets overridden on every push
            JAR="codeps-cli-main.jar"
          fi
          cp .deder/out/cli/assembly/out.jar "$JAR"
          echo "JAR_NAME=$JAR" >> $GITHUB_ENV
      - name: Upload artifact
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v7
        with:
          name: codeps-cli
          path: ${{ env.JAR_NAME }}
          if-no-files-found: error
      - name: Create GitHub Release
        # on main pushes: rolling "main" release, always overridden with the latest build
        # on tag pushes: versioned release (e.g. v1.2.3)
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.JAR_NAME }}
          # no changelog needed for the rolling main release
          generate_release_notes: ${{ github.ref_type == 'tag' }}
