name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (no v prefix, e.g. 1.2.3)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  JAVA_VERSION: '21'
  JAVA_DISTRO: zulu

jobs:
  build-main:
    if: github.event_name == 'push' && github.repository == 'sake92/codeps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: coursier/cache-action@v7
      - name: Set Homebrew env
        shell: bash
        run: echo "HOMEBREW_NO_SANDBOX_LINUX=1" >> $GITHUB_ENV
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install deder
        run: brew install sake92/tap/deder
      - name: Build CLI assembly
        shell: bash -eo pipefail {0}
        run: deder exec -t assembly -m cli
      - name: Name the jar
        shell: bash -eo pipefail {0}
        run: |
          # fixed name so the rolling "main" release asset gets overridden on every push
          JAR="codeps-cli-main.jar"
          cp .deder/out/cli/assembly/out.jar "$JAR"
          echo "JAR_NAME=$JAR" >> $GITHUB_ENV
      - name: Upload artifact
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v7
        with:
          name: codeps-cli
          path: ${{ env.JAR_NAME }}
          if-no-files-found: error
      - name: Create GitHub Release
        # rolling "main" release, always overridden with the latest build
        # versioned releases are created by the manual JReleaser jobs below
        uses: softprops/action-gh-release@v3
        with:
          tag_name: main
          files: ${{ env.JAR_NAME }}
          generate_release_notes: false

  precheck:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'sake92/codeps'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: vars
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must be semantic (for example, 1.2.3)" >&2
            exit 2
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Action"
          git commit -a --allow-empty -m "Releasing version $VERSION"
          git push origin main

  # Releases are manual, not tag-triggered: JReleaser creates the v<version> tag.
  # On a main push precheck is skipped, so GitHub skips this dependent job; tag
  # pushes do not trigger this workflow.
  release:
    needs: precheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}
      - uses: coursier/cache-action@v7
        with:
          extraFiles: deder.pkl
      - name: Set Homebrew environment
        shell: bash
        run: echo "HOMEBREW_NO_SANDBOX_LINUX=1" >> "$GITHUB_ENV"
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install deder
        run: brew install sake92/tap/deder
      - name: Build CLI assembly
        shell: bash -eo pipefail {0}
        run: |
          deder exec -t assembly -m cli
          cp .deder/out/cli/assembly/out.jar codeps-cli-${{ needs.precheck.outputs.version }}.jar
      - name: Release and publish Homebrew formula
        uses: jreleaser/release-action@v2
        with:
          arguments: full-release
        env:
          JRELEASER_PROJECT_VERSION: ${{ needs.precheck.outputs.version }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          JRELEASER_HOMEBREW_GITHUB_TOKEN: ${{ secrets.JRELEASER_HOMEBREW_GITHUB_TOKEN }}
      - name: Upload JReleaser output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-release
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
